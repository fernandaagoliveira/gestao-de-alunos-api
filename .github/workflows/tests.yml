name: Testes de API

on:
  push:
    branches: [trabalho-final-conclusao-da-disciplina]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar servidor em background
        run: npm start &
        env:
          PORT: 3000

      - name: Aguardar servidor iniciar
        run: sleep 5

      - name: Executar testes
        run: npm test
        env:
          PORT: 3000
          BASE_URL: http://localhost:3000
          ADMIN_EMAIL: admin@escola.com
          ADMIN_SENHA: admin123
